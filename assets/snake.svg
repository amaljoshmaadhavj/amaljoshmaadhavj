<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="520" height="120" viewBox="0 0 520 120" preserveAspectRatio="xMidYMid meet">
  <rect width="100%" height="100%" fill="transparent" />

  <!-- Smooth bezier path for the snake -->
  <path id="snakePath" d="M20 60 C 110 10, 190 110, 270 60 S 430 10, 500 60" fill="none" stroke="none"/>

  <!-- Gradient for nicer body shading -->
  <defs>
    <linearGradient id="bodyGrad" x1="0%" x2="100%" y1="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Dashed snake body (animated dash offset makes segments travel) -->
  <path id="snakeBody" d="M20 60 C 110 10, 190 110, 270 60 S 430 10, 500 60"
        fill="none" stroke="url(#bodyGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="20 14" opacity="0.98" />
  <animate xlink:href="#snakeBody" attributeName="stroke-dashoffset" from="0" to="-140" dur="2.6s" repeatCount="indefinite" />

  <!-- Head that moves along the path and rotates to match direction -->
  <g id="head" transform="translate(0,0)">
    <circle r="9" fill="#059669" stroke="#064e3b" stroke-width="1" />
    <circle r="3" fill="#ffffff" opacity="0.95" cx="-2" cy="-2" />
    <animateMotion dur="2.6s" rotate="auto" repeatCount="indefinite">
      <mpath xlink:href="#snakePath" />
    </animateMotion>
  </g>

  <!-- Subtle drop shadow under the body -->
  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="1.6" result="s" />
    <feOffset in="s" dx="0" dy="2" result="o" />
    <feMerge>
      <feMergeNode in="o" />
      <feMergeNode in="SourceGraphic" />
    </feMerge>
  </filter>
  <use href="#snakeBody" filter="url(#shadow)" opacity="0.14" />

</svg>
