<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="520" height="120" viewBox="0 0 520 120" preserveAspectRatio="xMidYMid meet">
  <rect width="100%" height="100%" fill="transparent" />

  <!-- Path used by both the stroke (dashed snake body) and the head motion -->
  <path id="snakePath" d="M20 60 C 110 10, 190 110, 270 60 S 430 10, 500 60" fill="none" stroke="none"/>

  <!-- Dashed snake body (animated dash offset makes segments travel) -->
  <path id="snakeBody" d="M20 60 C 110 10, 190 110, 270 60 S 430 10, 500 60"
        fill="none" stroke="#16a34a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="18 12 18 12" opacity="0.95" />
  <animate xlink:href="#snakeBody" attributeName="stroke-dashoffset" from="0" to="-120" dur="3s" repeatCount="indefinite" />

  <!-- A slightly brighter head that moves along the path to emphasize motion -->
  <g id="head">
    <circle r="8" fill="#10b981" stroke="#064e3b" stroke-width="1"/>
    <circle r="3" fill="#ffffff" opacity="0.9" cx="-2" cy="-2"/>
    <animateMotion dur="3s" repeatCount="indefinite">
      <mpath xlink:href="#snakePath" />
    </animateMotion>
  </g>

  <!-- Optional subtle glow for depth -->
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="1.2" result="b" />
    <feMerge>
      <feMergeNode in="b" />
      <feMergeNode in="SourceGraphic" />
    </feMerge>
  </filter>
  <use href="#snakeBody" filter="url(#blur)" opacity="0.15" />

</svg>
